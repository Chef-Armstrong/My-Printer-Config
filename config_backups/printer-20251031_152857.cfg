diag1_pin: ^!PF2
spi_bus: spi4
interpolate: true
run_current: 1.25
sense_resistor: 0.075
#stealthchop_threshold: 0
#driver_IHOLDDELAY: 10
#driver_TPOWERDOWN: 20
#driver_TBL: 2
#driver_TOFF: 5
#driver_HEND: 5
#driver_HSTRT: 4
#driver_SGTHRS: 100
#home_current: 1.5

# Motor-3
[tmc2209 extruder]
uart_pin: PG12
run_current: 0.55
interpolate: true
sense_resistor: 0.110
#stealthchop_threshold: 0
# driver_IHOLDDELAY: 8
# driver_TPOWERDOWN: 20
# driver_TBL: 2
# driver_TOFF: 3
# driver_HEND: 0
# driver_HSTRT: 5

# Motor-4 Z1 rear
[tmc2209 stepper_z]
