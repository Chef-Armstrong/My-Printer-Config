sense_resistor: 0.110
#stealthchop_threshold: 0
#driver_IHOLDDELAY: 8
#driver_TPOWERDOWN: 20
#driver_TBL: 2
#driver_TOFF: 5
#driver_HEND: 5
#driver_HSTRT: 4
#home_current: 1.5

# Motor-5 Z2 front right
[tmc2209 stepper_z1]
uart_pin: PG10
interpolate: true
run_current: 0.6
sense_resistor: 0.110
#stealthchop_threshold: 0
#driver_IHOLDDELAY: 8
#driver_TPOWERDOWN: 20
#driver_TBL: 2
#driver_TOFF: 5
#driver_HEND: 5
#driver_HSTRT: 4
#home_current: 1.5

# Motor-6 Z3 front left
[tmc2209 stepper_z2]
uart_pin: PG9
interpolate: true
run_current: 0.6
sense_resistor: 0.110
#stealthchop_threshold: 0
#driver_IHOLDDELAY: 8
#driver_TPOWERDOWN: 20
#driver_TBL: 2
#driver_TOFF: 5
