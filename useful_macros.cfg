[gcode_macro MPC_CALIBRATE_BED]
description: Bed MPC Calibrate
gcode:
  {% set _ = params.BED_TEMP|default(80) %}
  {% set _ = params.FAN_BREAKPOINTS|default(10) %}
  MPC_CALIBRATE HEATER=heater_bed TARGET={params.BED_TEMP|default(80)} FAN_BREAKPOINTS={params.FAN_BREAKPOINTS|default(10)}

[gcode_macro MPC_CALIBRATE_HOTEND]
description: Hotend MPC Calibrate
gcode:
  {% set _ = params.HOTEND_TEMP|default(260) %}
  {% set _ = params.FAN_BREAKPOINTS|default(10) %}
  MPC_CALIBRATE HEATER=extruder TARGET={params.HOTEND_TEMP|default(260)} FAN_BREAKPOINTS={params.FAN_BREAKPOINTS|default(10)}

[delayed_gcode STARTUP]
initial_duration: 1
gcode:
#  UNSYNC_ALL_TOOLS
#  SYNC_LAST_TOOL
#  SET_PIN PIN=LED VALUE=1

[gcode_macro M109] # Wait Hotend Temp
rename_existing: M109.1
gcode:
    #Parameters
    {% set s = params.S|float %}

    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  # Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-2} MAXIMUM={s+5}   # Wait for hotend temp (within n degrees)
    {% endif %}

[gcode_macro M190] # Wait Bed Temp
rename_existing: M190.1
gcode:
    #Parameters
    {% set s = params.S|float %}

    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   # Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-2} MAXIMUM={s+5}  # Wait for bed temp (within n degrees)
    {% endif %}

[gcode_macro _SET_MPC_MATERIAL]
description: Set heater MPC parameters for a given material
variable_filament_table:
    ## Update this table to adjust material settings
    {
        ## ( density, heat capacity )  # suggested heat capacity range
        "PLA"       : ( 1.25, 2.20 ),  # 1.80 - 2.20
        "PETG"      : ( 1.27, 2.20 ),  # 1.70 - 2.20
        "PC+ABS"    : ( 1.15, 2.20 ),  # 1.50 - 2.20
        "ABS"       : ( 1.06, 2.40 ),  # 1.25 - 2.40
        "ASA"       : ( 1.07, 2.10 ),  # 1.30 - 2.10
        "PA6"       : ( 1.12, 2.50 ),  # 2.00 - 2.50
        "PA"        : ( 1.15, 2.50 ),  # 2.00 - 2.50
        "PC"        : ( 1.20, 1.90 ),  # 1.10 - 1.90
        "TPU"       : ( 1.21, 2.00 ),  # 1.50 - 2.00
        "TPU-90A"   : ( 1.15, 2.00 ),  # 1.50 - 2.00
        "TPU-95A"   : ( 1.22, 2.00 ),  # 1.50 - 2.00
        "ABS-CF"    : ( 1.11, 2.40 ),  # 1.25 - 2.40
        "ASA-CF"    : ( 1.11, 2.10 ),  # 1.30 - 2.10
        "PA6-CF"    : ( 1.19, 2.50 ),  # 2.00 - 2.50
        "PC+ABS-CF" : ( 1.22, 2.20 ),  # 1.50 - 2.20
        "PC+CF"     : ( 1.36, 1.90 ),  # 1.10 - 1.90
        "PLA-CF"    : ( 1.29, 2.20 ),  # 1.80 - 2.20
        "PETG-CF"   : ( 1.30, 2.20 ),  # 1.70 - 2.20
    }
gcode:
    {% set material = params.MATERIAL | upper %}
    {% set heater = params.HEATER | default('extruder') %}
    {% set extruder_config = printer.configfile.settings[heater] %}

    {% if material in filament_table %}
        {% set (density, heat_capacity) = filament_table[material] %}

        RESPOND PREFIX=🔥 MSG="Configured {heater} MPC for {material}. Density: {density}, Heat Capacity: {heat_capacity}"
    {% else %}
        {% set density = extruder_config.filament_density %}
        {% set heat_capacity=extruder_config.filament_heat_capacity %}

        RESPOND PREFIX=🔥 MSG="Unknown material '{material}', using default mpc parameters for {heater}"
    {% endif %}

    MPC_SET HEATER={heater} FILAMENT_DENSITY={density} FILAMENT_HEAT_CAPACITY={heat_capacity}

[gcode_macro _SET_CHAMBER_MATERIAL]
description: Set chamber temperature and vent fan based on filament material
variable_chamber_table:
    ## ( target_temp, vocs_flag )
    {
        "PLA"       : ( 0,     False ),  # No chamber heat needed
        "PETG"      : ( 30,    False ),
        "ABS"       : ( 50,    True  ),
        "ASA"       : ( 50,    True  ),
        "ASA-GF"    : ( 50,    True  ),
        "PC"        : ( 55,    True  ),
        "PC+ABS"    : ( 55,    True  ),
        "PA"        : ( 45,    True  ),
        "PA6"       : ( 45,    True  ),
        "TPU"       : ( 30,    False ),
        "TPU-95A"   : ( 30,    False ),
        "TPU-90A"   : ( 30,    False ),
        "PETG-CF"   : ( 45,    True  ),
        "ABS-CF"    : ( 55,    True  ),
        "ASA-CF"    : ( 55,    True  ),
        "PC+ABS-CF" : ( 55,    True  ),
        "PC+CF"     : ( 55,    True  ),
        "PA6-CF"    : ( 50,    True  ),
        "PLA-CF"    : ( 35,    False )
    }
gcode:
    {% set material = params.MATERIAL | upper %}
    {% if material in chamber_table %}
        {% set (target_temp, vocs) = chamber_table[material] %}
        {% if target_temp > 0 %}
            SET_HEATER_TEMPERATURE HEATER=chamber TARGET={target_temp}
            RESPOND PREFIX=🌡️ MSG="Chamber set to {target_temp}°C for {material}"
        {% else %}
            SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0
            RESPOND PREFIX=🌡️ MSG="No chamber heat needed for {material}"
        {% endif %}

        {% if vocs %}
            RESPOND PREFIX=🌬️ MSG="VOC detected material: enabling chamber vent"
            {% if 'fan_generic chamber' in printer.configfile.settings %}
                SET_FAN_SPEED FAN=chamber SPEED=1
            {% endif %}
        {% else %}
            RESPOND PREFIX=🌬️ MSG="Low VOC material: chamber vent off"
            {% if 'fan_generic chamber' in printer.configfile.settings %}
                SET_FAN_SPEED FAN=chamber SPEED=0
            {% endif %}
        {% endif %}
    {% else %}
        RESPOND PREFIX=⚠️ MSG="Unknown material '{material}', no chamber settings applied"
    {% endif %}

[gcode_macro FILAMENT_DRYER]
description: Dry filament using chamber and bed temperature based on filament type w/ auto wait for spool placement
variable_dryer_table:
    {   ## (Chamber Temp, Bed Temp, Hours)
        "PLA"     : (45, 45, 8),
        "PLA-CF"  : (45, 45, 8),
        "PETG"    : (65, 65, 8),
        "ABS"     : (75, 75, 8),
        "ASA"     : (75, 75, 8),
        "PC"      : (75, 90, 8),
        "TPU"     : (45, 45, 8),
        "PA"      : (75, 85, 12),
        "PA-CF"   : (75, 85, 12)
    }
gcode:
    {% set filament = params.MATERIAL|default("PLA")|upper %}
    {% set chamber_temp, bed_temp, default_hours = dryer_table.get(filament, dryer_table["PLA"]) %}
    {% set hours = params.TIME_HOURS|default(default_hours)|float %}
    {% set total_seconds = (hours * 3600)|int %}

    RESPOND PREFIX="🔥" MSG="Drying {filament}: Chamber {chamber_temp}°C, Bed {bed_temp}°C for {hours}h"
    G28
    G0 X20 Y200 F15000
    G0 Z220 F15000
    
    {% for s in range(30, 0, -5) %}
        RESPOND PREFIX="⏳" MSG="Starting soon… {s}s"
        G4 P5000
    {% endfor %}

    SET_HEATER_TEMPERATURE HEATER=chamber TARGET={chamber_temp}
    M190 S{bed_temp}

    {% set full_minutes = total_seconds // 60 %}
    {% set leftover = total_seconds % 60 %}

    {% for i in range(full_minutes) %}
        {% set remaining = total_seconds - (i * 60) %}
        {% set mins = remaining // 60 %}
        {% set secs = remaining % 60 %}
        RESPOND PREFIX="⌛" MSG="Time remaining: {mins}m {secs}s"
        G4 P60000
    {% endfor %}

    {% if leftover > 0 %}
        RESPOND PREFIX="⌛" MSG="Time remaining: 0m {leftover}s"
        G4 P{ leftover * 1000 }
    {% endif %}

    RESPOND PREFIX="✅" MSG="Drying complete for {filament}"
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0
    M140 S0
    RESPOND PREFIX="❄️" MSG="Chamber and bed cooling down"

[pa_test]
size_x: 100   # X dimension tower size  (mm)
size_y: 50    # Y dimension tower size  (mm)
height: 50    # Height of tower (mm)
origin_x: 113.50 # Center of the bed in X
origin_y: 105.50 # Center of the bed in Y
layer_height: 0.2 # mm
first_layer_height: 0.24 # mm
perimeters: 2 # Number of perimeters to be printed for the tower
brim_width: 6 # Width of brim (mm)
slow_velocity:   20 # Slowest velocity for PA test segment (mm/s)
medium_velocity: 300 # Medium velocity for PA test segment (mm/s)
fast_velocity:  600 # End velocity for PA test segment (mm/s)
filament_diameter: 1.75
fan_speed: 0.5 # Fan speed applied after the brim is printed

[delayed_gcode start_pa_test]
gcode:
    {% set vars = printer["gcode_macro RUN_PA_TEST"] %}
    START_PRINT  BED_TEMP={vars.bed_temp} EXTRUDER_TEMP={vars.hotend_temp}
    {% set flow_percent = vars.flow_rate|float * 100.0 %}
    {% if flow_percent > 0 %}
        M221 S{flow_percent}
    {% endif %}
    {% set height = printer.configfile.settings.pa_test.height %}
    {% set pavalue = vars.pa_value %}
    ; If pa_value is 0 then we test the full pa range starting from 0
    {% if  vars.pa_value == 0 %}
        {% if vars.testparam == 0 %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=.001 ; .01 for bowden
        {% elif vars.testparam == 1 %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=OFFSET START=0 FACTOR=.01 ; .02 for bowden
        {% elif vars.testparam == 2 %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=TIME_OFFSET START=0 FACTOR=.0001
        {% endif %}
    {% else %}
        ; make sure that delta and start can not be lower then 0
        {% if (vars.pa_value - vars.pa_range <= 0) and (vars.testparam <= 2) %}
            {% set delta = vars.pa_range %}
            {% set start = 0 %}
        {% else %}
            ; calculate the pa range that we want to test
            {% set delta = (vars.pa_value + vars.pa_range)  - (vars.pa_value - vars.pa_range)  %}
            ; calculate the pa start value
            {% set start = vars.pa_value - vars.pa_range %}
        {% endif %}
        {% if vars.testparam == 0 %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START={start} FACTOR={delta / height}
        {% elif vars.testparam == 1 %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=OFFSET START={start} FACTOR={delta / height}
        {% elif vars.testparam == 2 %}
            TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=TIME_OFFSET START={start} FACTOR={delta / height}
        {% endif %}
    {% endif %}
    ; PRINT_PA_TOWER must be the last command in the start_pa_test script:
    ; it starts a print and then immediately returns without waiting for the print to finish
    PRINT_PA_TOWER {vars.rawparams} FINAL_GCODE_ID=end_pa_test

[delayed_gcode end_pa_test]
gcode:
    END_PRINT
    RESTORE_GCODE_STATE NAME=PA_TEST_STATE

[gcode_macro RUN_PA_TEST]
variable_bed_temp: -1
variable_hotend_temp: -1
variable_pa_value: 0             # Used for further tuning of pa value. If value is not 0 than the tested pa value will only be +/- (determined by the pa_range variable) around of the pa_value variable
variable_pa_range: 0.03          # Only use if pa_value is set to heigher than 0. Used to set the +/- area around pa_value that should be tested
variable_flow_rate: -1
variable_testparam: 0            # 0 = advance, 1 = offset, 2 = time_offset
variable_fan_speed: 0.5
variable_rawparams: ''
gcode:
    # Fail early if the required parameters are not provided
    {% if params.NOZZLE is not defined %}
    {action_raise_error('NOZZLE= parameter must be provided')}
    {% endif %}
    {% if params.TARGET_TEMP is not defined %}
    {action_raise_error('TARGET_TEMP= parameter must be provided')}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=bed_temp VALUE={params.BED_TEMP|default(60)}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=hotend_temp VALUE={params.TARGET_TEMP}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=pa_value VALUE={params.PA_VALUE|default(0)}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=pa_range VALUE={params.PA_RANGE|default(0.01)}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=flow_rate VALUE={params.FLOW_RATE|default(-1)}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=testparam VALUE={params.TESTPARAM|default(0)}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=fan_speed VALUE={params.FAN_SPEED|default(0.5)}
    SET_GCODE_VARIABLE MACRO=RUN_PA_TEST VARIABLE=rawparams VALUE="'{rawparams}'"
    SAVE_GCODE_STATE NAME=PA_TEST_STATE
    UPDATE_DELAYED_GCODE ID=start_pa_test DURATION=0.01